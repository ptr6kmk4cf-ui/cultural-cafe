<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Cultural Café — offline</title>
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #120e0a; color: #ddd6c8; font: 16px/1.5 system-ui, sans-serif; text-align: center; padding: 24px; }
    img { width: 72px; height: 72px; border-radius: 18px; }
    button { margin-top: 16px; padding: 10px 18px; border: 0; border-radius: 10px; background: linear-gradient(135deg, #b06f1c, #623a18); color: #fff; font-weight: 700; }
  </style>
</head>
<body>
  <main>
    <img src="/icons/icon-192.png" alt="" />
    <h1>You're offline</h1>
    <p>Cultural Café needs a connection to reach your account and the Café.</p>
    <button type="button" onclick="location.replace(location.pathname === '/offline.html' ? '/app' : location.href)">Try again</button>
  </main>
</body>
</html>
